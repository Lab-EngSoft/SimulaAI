# CI do SimulaAI — roda a suíte pytest a cada push/PR para a main.
# História: rastreabilidade das evidências de teste (links de CI run nas
# evidências de sprint substituem prints manuais).
name: testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar a suíte de testes
        # Sem AI_API_KEY no CI — prova que correção e explicações (fallback)
        # funcionam sem a IA (histórias #6 e #7).
        env:
          DATABASE_URL: "sqlite://"
          SECRET_KEY: "chave-de-ci-simulaai-usada-apenas-no-actions"
        run: python -m pytest -v
